name: Build and release rule-sets

on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 3 * * *"  # ежедневно, подхватывает обновления itdoginfo/MetaCubeX
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release download -R SagerNet/sing-box --pattern 'sing-box-*-linux-amd64.tar.gz' -O sing-box.tar.gz --clobber && break
            sleep $((i * 15))
          done
          tar xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Fetch upstream + merge with own lists
        run: python3 scripts/merge.py

      - name: Compile rule-sets
        run: |
          mkdir -p dist
          sing-box rule-set compile domains.json -o dist/domains.srs
          sing-box rule-set compile subnets.json -o dist/subnets.srs

      - name: Commit compiled rule-sets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/domains.srs dist/subnets.srs
          git diff --staged --quiet && exit 0
          git commit -m "Rebuild dist/*.srs [skip ci]"
          git push

      # Роутер качает списки с raw.githubusercontent, а не отсюда: uclient-fetch
      # в OpenWrt не проходит цепочку редиректов релизных ассетов (см. 6bacfda).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "latest" \
            --notes "Скомпилированные rule-set'ы. Пересобираются автоматически, ассеты перезаписываются на месте."
          gh release upload latest dist/domains.srs dist/subnets.srs --clobber
          gh release edit latest --notes "Обновлено: $(date -u '+%Y-%m-%d %H:%M UTC') • $(git rev-parse --short HEAD)"
