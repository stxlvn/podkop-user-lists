name: Build and release rule-sets

on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 3 * * *"  # ежедневно, подхватывает обновления itdoginfo/MetaCubeX
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          curl -fsSL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/latest/download/sing-box-$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -oP '"tag_name": "v\K[^"]+')-linux-amd64.tar.gz"
          tar xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Fetch upstream + merge with own lists
        run: python3 scripts/merge.py

      - name: Compile rule-sets
        run: |
          sing-box rule-set compile domains.json -o domains.srs
          sing-box rule-set compile subnets.json -o subnets.srs

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: |
            domains.srs
            subnets.srs
          make_latest: true
