name: Build and release rule-sets

on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 3 * * *"  # ежедневно, подхватывает обновления itdoginfo/MetaCubeX
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release download -R SagerNet/sing-box --pattern 'sing-box-*-linux-amd64.tar.gz' -O sing-box.tar.gz --clobber && break
            sleep $((i * 15))
          done
          tar xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Install tachyon-core
        env:
          GH_TOKEN: ${{ github.token }}
          TACHYON_CORE_TAG: v0.3.1
        run: |
          for i in 1 2 3; do
            gh release download "$TACHYON_CORE_TAG" -R Dushnilin/tachyon-core --pattern 'tachyon-core-linux-amd64-*.tar.gz' --pattern SHA256SUMS --clobber && break
            sleep $((i * 15))
          done
          tar xzf tachyon-core-linux-amd64-*.tar.gz
          bin=$(ls tachyon-core-linux-amd64-v* | grep -v '\.tar\.gz$')
          grep " ./$bin\$" SHA256SUMS | sha256sum -c
          sudo install -m 755 "$bin" /usr/local/bin/tachyon-core
          rm -f tachyon-core-linux-amd64-* SHA256SUMS
          tachyon-core version

      - name: Fetch upstream + merge with own lists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/merge.py

      - name: Compile rule-sets
        run: |
          mkdir -p dist
          sing-box rule-set compile domains.json -o dist/domains.srs
          sing-box rule-set compile subnets.json -o dist/subnets.srs
          tachyon-core rule-set compile domains.json -o dist/domains.trs
          tachyon-core rule-set compile subnets.json -o dist/subnets.trs
          for f in russia-domains russia-subnets; do
            sing-box rule-set compile $f.json -o dist/$f.srs
            tachyon-core rule-set compile $f.json -o dist/$f.trs
          done

      - name: Commit compiled rule-sets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.srs dist/*.trs
          git diff --staged --quiet && exit 0
          git commit -m "Rebuild dist/*.srs, dist/*.trs [skip ci]"
          git push

      # Роутер качает списки с raw.githubusercontent, а не отсюда: uclient-fetch
      # в OpenWrt не проходит цепочку редиректов релизных ассетов (см. 6bacfda).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "latest" \
            --notes "Скомпилированные rule-set'ы. Пересобираются автоматически, ассеты перезаписываются на месте."
          gh release upload latest dist/*.srs dist/*.trs --clobber
          gh release edit latest --notes "Обновлено: $(date -u '+%Y-%m-%d %H:%M UTC') • $(git rev-parse --short HEAD)"
